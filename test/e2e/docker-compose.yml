services:
  public:
    image: android-sms-gateway/server
    build:
      context: ../..
      dockerfile: ./build/package/Dockerfile
      args:
        - APP=sms-gateway
    environment:
      - DEBUG=
      - CONFIG_PATH=config.yml
      - GOOSE_DBSTRING=/app/data/sms-public.db?_pragma=foreign_keys(1)
      - HTTP__LISTEN=0.0.0.0:3000
      - DATABASE__DIALECT=sqlite3
      - DATABASE__DATABASE=/app/data/sms-public.db
      - GATEWAY__MODE=public
      - FCM__CREDENTIALS_JSON=${FCM__CREDENTIALS_JSON:-{}}
    ports:
      - "3000:3000"
    volumes:
      - ./data/config.yml:/app/config.yml:ro
      - public-data:/app/data
    restart: 'unless-stopped'
    user: root

  private:
    image: android-sms-gateway/server
    build:
      context: ../..
      dockerfile: ./build/package/Dockerfile
      args:
        - APP=sms-gateway
    environment:
      - DEBUG=
      - CONFIG_PATH=config.yml
      - GOOSE_DBSTRING=/app/data/sms-private.db?_pragma=foreign_keys(1)
      - HTTP__LISTEN=0.0.0.0:3000
      - DATABASE__DIALECT=sqlite3
      - DATABASE__DATABASE=/app/data/sms-private.db
      - GATEWAY__MODE=private
      - GATEWAY__PRIVATE_TOKEN=123456789
      - FCM__CREDENTIALS_JSON=${FCM__CREDENTIALS_JSON:-{}}
    ports:
      - "3001:3000"
    volumes:
      - ./data/config.yml:/app/config.yml:ro
      - private-data:/app/data
    restart: 'unless-stopped'
    user: root

volumes:
  public-data:
  private-data:
